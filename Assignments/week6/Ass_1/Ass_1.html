<!DOCTYPE>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Login page">
        <meta name="author" content="Abdelrhman">
        <title>Login Page</title>
    </head>
    <body>
        <form method="post" action="test.py">
            <div>
                <label>User Name</label>
                    <br>
                <input type="text" name="User" required placeholder="User Name">
            </div>
            <hr>
            <div>
                <label>Password</label>
                <br>
                <input type="password" name="pass" required placeholder="Password">
            </div>
            <hr>
            <div>
                <label>Mobile</label>
                <br>
                <input type="tel" name="phone" placeholder="+20100 (234) 123" pattern="\+201\d{2} \(\d{3}\) \d{3}">
            </div>
            <hr>
            <div>
                <label>Email</label>
                <br>
                <input type="email" name="Email" required placeholder="Email">
            </div>
            <div>
                <label>Subject</label>
                <br>
                <input type="text" name="Subject"  placeholder="Subject">
            </div>
            <hr>
            <input type="hidden" name="hidden" value="1234">
            <input type="reset" value="Empty Form" >
            <input type="submit" name="submit" value="Send Data">
        </form>
    </body>
</html>
