<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
    </head>
    <body>
        <!-- Here are various uses of the <a> (Anchor) tag in HTML: -->

        <!-- Linking to another webpage (External link): 
    The most common use of the <a> tag is to create a hyperlink that navigates to another webpage.
    -->
        <a href="https://www.example.com">Visit Example</a>
<hr>
        <!--
    Linking to a section within the same page (Internal link):
    You can link to a specific section within the same page using anchor IDs.
    -->
        <a href="#section1">Go to Section 1</a>
        <div id="section1">This is Section 1</div>
<hr>
        <!--
    Opening a link in a new tab:
    The target="_blank" attribute opens the link in a new browser tab.
    -->
        <a href="https://www.example.com" target="_blank">Open in new tab</a>
<hr>
        <!--
    Download a file: 
    The download attribute allows users to download the linked resource rather than navigating to it.
    -->
        <a href="file.pdf" download>Download PDF</a>
<hr>
        <!-- 
    Linking to an email address: 
    You can create a mailto link that opens the default email client.
    -->
        <a href="mailto:someone@example.com">Send Email</a>
<hr>
        <!-- 
    Linking to a phone number: 
    This creates a clickable link to dial a phone number on mobile devices. 
    -->
        <a href="tel:+1234567890">Call Us</a>
<hr>
        <!-- 
    Creating tooltips: 
    You can add a title attribute to provide additional information as a tooltip. 
    -->
        <a href="https://www.example.com" title="Visit Example">Hover to see
            tooltip</a>
<hr>
        <!-- 
    Using rel attribute for SEO or security purposes: 
    The rel="nofollow" attribute prevents search engines from following the link, which can be useful for untrusted or paid links. 
    -->
        <a href="https://www.example.com" rel="nofollow">Untrusted Link</a>
<hr>
        <!-- 
    Button-style links: 
    You can style an anchor tag to look and behave like a button you create class name button in css . 
    -->
        <a href="https://www.example.com" class="button">Click Me</a>
<hr>
        <!-- 
    Linking to a file with query parameters: 
    You can pass query parameters through the URL for dynamic content generation. 
    -->
        <a href="page.html?section=1">Go to Section 1</a>
<hr>
        <!-- 
    Linking to a fragment of another page: 
    You can link to a specific section on another page. 
    -->
        <a href="anotherpage.html#section2">Go to Section 2 on another page</a>
    </body>
</html>
