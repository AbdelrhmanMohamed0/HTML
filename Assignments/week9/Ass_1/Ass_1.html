<!-- 
What is the appropriate element to submit data when clicked?
The appropriate element is <button> or <input type="submit">. 
This element is used to trigger actions like submitting a form when clicked. 
-->
<button type="submit">Submit</button>


<!-- 
What is the appropriate element to be the main heading of the entire page?
The appropriate element for the main heading of the page is <h1>. 
This element defines the main title of the page. 
-->
<h1>Page Title</h1>


<!-- 
What is the appropriate element to be a section heading inside the page?
The appropriate element for section headings is <h2> or <h3>, 
depending on the hierarchy level. 
-->
<h2>Section Title</h2>


<!-- 
What is the appropriate element to contain a paragraph of text?
The appropriate element for a paragraph is <p>. 
It is used to write blocks of text. 
-->
<p>This is a paragraph of text.</p>


<!-- 
How do you specify the language of your page content?
You can use the <html> element with the lang attribute to specify the language. 
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Language Example</title>
</head>
<body>
    <p>This text is in English.</p>
</body>
</html>


<!-- 
If you have a <div> element and want to make it accessible via the Tab button, what would you do to the element?
To make a <div> accessible via the Tab button, 
you should add the tabindex attribute with a value of 0 or greater.
-->
<div tabindex="0">This element is accessible via Tab</div>


<!-- 
What does ARIA mean?
ARIA stands for "Accessible Rich Internet Applications." It is a set of attributes used to make web applications
more accessible to people with disabilities, particularly for screen reader users. 
-->
