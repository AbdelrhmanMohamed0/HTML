<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Electronic Component" />
        <meta name="author" content="Abdelrhman" />
        <title>video and audio </title>
    </head>
    <body>
        <header>
            <h2>Video and Audio Players</h2>
        </header>
        <hr>
        <div>
            <section class="img">
                <h3><article>img section</article></h3>
                <figure>
                    <img src="download.jpeg" alt="ai photo" width="600"
                        height="400">
                    <figcaption> this is photo for AI</figcaption>
                </figure>
            </section>
            <hr>
            <section class="video">
                <h3><article>video section</article></h3>
                <video controls width="600" height="400"
                    poster="download (1).jpeg">
                    <source src="The History of AI - One Minute History.mp4"
                        type="video/mp4">
                    <track src="video.vtt" kind="subtitles" srclang="en"
                        label="English">
                    your browser not support type of video
                </video>
            </section>
            <hr>
            <section class="audio">
                <h3><article>audio section</article></h3>
                <audio controls>
                    <source src="videoplayback.weba" type="audio/ogg">
                    your browser not support type of audio
                </audio>
            </section>
        </div>
        <hr>
        <footer>
            <h5>thanks</h5>
        </footer>
    </body>
</html>
