<!DOCTYPE>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Login page">
        <meta name="author" content="Abdelrhman">
        <title>Login Page</title>
    </head>
    <body>
        <form method="post">
            <div>
                <label>User Name</label>
                <input type="text" name="User" required placeholder="User Name">
            </div>
            <br>
            <div>
                <label>Password</label>
                <input type="password" name="pass" required placeholder="Password">
            </div>
            <br>
            <div>
                <label>Email</label>
                <input type="email" name="Email" value="Dody2@gmail.com">
            </div>
            <br>
            <input type="color" value="Color">
            <input type="range" name="range" min="0" max="100" step="20" value="80">
            <input type="number" name="number" min="0" max="100" step="1">
            <br>
            <input type="reset" value="Reset" >
            <input type="submit" name="submit" >
            <input type="submit" name="submit" value="Save">
        </form>
    </body>
</html>
